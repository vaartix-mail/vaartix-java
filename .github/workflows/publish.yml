name: Publish to Maven Central
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # Maven Central has no trusted publishing, so this uses a Central Portal user token and a GPG
    # signing key, stored only in the "maven-central" environment's secrets.
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check the tag matches the version
        run: test "${GITHUB_REF_NAME#v}" = "$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
      - name: Test, sign and publish
        run: mvn -B -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
